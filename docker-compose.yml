# Stacy-Cloud: Dual Service Deployment
version: '3.8'

services:
  stacy:
    build:
      context: ./stacy
      dockerfile: Dockerfile
    container_name: stacy-cloud
    restart: always
    ports:
      - "10000:10000"
    volumes:
      - ./stacy/config:/app/config
    env_file:
      - ./stacy/config/.env
    environment:
      - NODE_ENV=production
      - RENDER=true
      - IS_DOCKER=true

  # Vecna (Music Bot): Optional on Cloud if it's just for chatting about music
