# Render Blueprint (Native Node.js Implementation)
services:
  - type: web
    name: stacy-ai-premium
    env: node
    rootDir: stacy
    branch: main
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: IS_RENDER
        value: "true"
      # เจ้านายอย่าลืมใส่ค่าเหล่านี้ใน Dashboard ของ Render:
      # TELEGRAM_TOKEN, NVIDIA_API_KEY, CALENDAR_ID, FIREBASE_SERVICE_ACCOUNT_JSON

  - type: web
    name: vecna-music-bot
    env: node
    rootDir: vecna
    branch: main
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: PORT
        value: 3000
